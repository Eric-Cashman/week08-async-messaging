<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Fulfillment Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 760px; padding: 0 1rem; color: #1f2933; }
    h1 { font-size: 1.4rem; }
    form { display: grid; gap: 0.75rem; padding: 1rem; border: 1px solid #d0d7de; border-radius: 8px; }
    label { display: grid; gap: 0.25rem; font-size: 0.85rem; font-weight: 600; }
    input { padding: 0.45rem; border: 1px solid #b6bfc8; border-radius: 6px; font: inherit; }
    .item-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 0.5rem; align-items: end; }
    button { padding: 0.5rem 0.9rem; border: 0; border-radius: 6px; background: #2457c5; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #e4e8ec; color: #1f2933; }
    button:disabled { opacity: 0.6; cursor: default; }
    #message { min-height: 1.2rem; font-size: 0.9rem; }
    #message.error { color: #b42318; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e4e8ec; }
    .badge { display: inline-block; padding: 0.1rem 0.55rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .queued { background: #fff4cc; color: #7a5b00; }
    .processing { background: #dbeafe; color: #1d4ed8; }
    .completed { background: #d9f5e1; color: #166534; }
    .failed { background: #fde2e1; color: #b42318; }
  </style>
</head>
<body>
  <h1>Order Fulfillment Dashboard</h1>

  <form id="order-form">
    <label>Customer ID
      <input id="customerId" value="cust-1001" required />
    </label>
    <div id="items"></div>
    <div>
      <button type="button" class="secondary" id="add-item">+ Add item</button>
      <button type="submit" id="submit">Place order</button>
    </div>
    <div id="message" role="status"></div>
  </form>

  <table>
    <thead>
      <tr><th>Order ID</th><th>Customer</th><th>Status</th><th>Accepted in</th></tr>
    </thead>
    <tbody id="orders"></tbody>
  </table>

  <script>
    const itemsEl = document.getElementById("items");
    const ordersEl = document.getElementById("orders");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submit");

    function addItemRow(sku = "SKU-001", quantity = 1) {
      const row = document.createElement("div");
      row.className = "item-row";

      const skuLabel = document.createElement("label");
      skuLabel.textContent = "SKU";
      const skuInput = document.createElement("input");
      skuInput.className = "sku";
      skuInput.value = sku;
      skuInput.required = true;
      skuLabel.appendChild(skuInput);

      const qtyLabel = document.createElement("label");
      qtyLabel.textContent = "Quantity";
      const qtyInput = document.createElement("input");
      qtyInput.className = "qty";
      qtyInput.type = "number";
      qtyInput.min = "1";
      qtyInput.value = String(quantity);
      qtyInput.required = true;
      qtyLabel.appendChild(qtyInput);

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "secondary";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => {
        if (itemsEl.children.length > 1) row.remove();
      });

      row.append(skuLabel, qtyLabel, remove);
      itemsEl.appendChild(row);
    }

    function setBadge(el, status) {
      el.className = "badge " + status;
      el.textContent = status;
    }

    function addOrderRow(orderId, customerId, ms) {
      const tr = document.createElement("tr");
      const idCell = document.createElement("td");
      idCell.textContent = orderId.slice(0, 8) + "…";
      idCell.title = orderId;
      const customerCell = document.createElement("td");
      customerCell.textContent = customerId;
      const statusCell = document.createElement("td");
      const badge = document.createElement("span");
      setBadge(badge, "queued");
      statusCell.appendChild(badge);
      const latencyCell = document.createElement("td");
      latencyCell.textContent = ms + " ms";
      tr.append(idCell, customerCell, statusCell, latencyCell);
      ordersEl.prepend(tr);
      return badge;
    }

    // Poll the status endpoint until the order reaches a terminal state.
    function pollStatus(orderId, badge) {
      const timer = setInterval(async () => {
        try {
          const res = await fetch("/api/orders/" + orderId);
          if (!res.ok) return;
          const order = await res.json();
          setBadge(badge, order.status);
          if (order.status === "completed" || order.status === "failed") clearInterval(timer);
        } catch {
          // transient network error: keep polling
        }
      }, 1000);
    }

    document.getElementById("add-item").addEventListener("click", () => addItemRow());

    document.getElementById("order-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      messageEl.className = "";
      messageEl.textContent = "";

      const customerId = document.getElementById("customerId").value.trim();
      const items = [...itemsEl.children].map((row) => ({
        sku: row.querySelector(".sku").value.trim(),
        quantity: Number(row.querySelector(".qty").value),
      }));

      submitBtn.disabled = true;
      const started = performance.now();
      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ customerId, items }),
        });
        const elapsed = Math.round(performance.now() - started);
        const body = await res.json();

        if (res.status === 202) {
          messageEl.textContent = "Order accepted (HTTP 202): " + body.orderId;
          const badge = addOrderRow(body.orderId, customerId, elapsed);
          pollStatus(body.orderId, badge);
        } else {
          messageEl.className = "error";
          messageEl.textContent = (body.error || "Request failed") + (body.details ? ": " + body.details.join("; ") : "");
        }
      } catch (err) {
        messageEl.className = "error";
        messageEl.textContent = "Could not reach the API.";
      } finally {
        submitBtn.disabled = false;
      }
    });

    addItemRow();
  </script>
</body>
</html>
